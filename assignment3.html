<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>
    <style>
      
        .navbar {
            background-color: #c3c3d3;
            overflow: hidden;    
            border-radius: 200px;
            font-weight: bold;

        }

      
        .navbar a {
            float: right;      
            display: block;        
            color: rgb(9, 9, 235);          
            text-align: right;    
            padding: 14px 20px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="#CONTACT">CONTACT</a>
        <a href="#TRANSPORT">TRANSPORT</a>
        <a href="#STAFF LOGIN">STAFF LOGIN</a>
        <a href="#STUDENT LOGIN">STUDENT LOGIN</a>
        <a href="#HOME">HOME</a>
    </div>
</body>
</html>
