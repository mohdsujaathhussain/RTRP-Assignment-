<!DOCTYPE html>
<html>
<head>
    <title>Horizontal List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0a0a;
            margin: 0;
            padding: 20px;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            border-radius: 100px;
            font-size: 20px;
            font-weight: bold;
        }
        li {
            margin-right: 70px;
            padding: 10px;
            background-color: #fefefe;

        }
        a {
            text-decoration: none;
            color: #0a0909;
        }
        a:hover {
            color: #f3f6f8;
        }
    </style>
</head>
<body>
    <ul>
        <li>FRONTEND</li>
        <lI>BACKEND</lI>
        <li>DATA BASE</li>
        <li>PROGRAMMING LANGUAGE</li>
        <li>DEPLOYEMENT</li>
        <li>FRAME WORK</li>  
    </ul>
</body>
</html>
